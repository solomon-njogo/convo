name: Protect master

on:
  pull_request:
    branches:
      - master

jobs:
  check-source-branch:
    name: check-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Allow merges into master only from dev
        run: |
          echo "PR source branch: ${GITHUB_HEAD_REF}"
          if [ "${GITHUB_HEAD_REF}" != "dev" ]; then
            echo "::error::Pull requests into master must come from the 'dev' branch (got '${GITHUB_HEAD_REF}')."
            exit 1
          fi
          echo "Source branch is 'dev' — allowed."
